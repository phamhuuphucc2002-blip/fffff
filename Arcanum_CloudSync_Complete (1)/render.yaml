services:
  - type: web
    name: arcanum-cloud-sync
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arcanum-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://arcanum-cloud-sync.onrender.com
      - key: PGSSL
        value: require

databases:
  - name: arcanum-db
    plan: free
